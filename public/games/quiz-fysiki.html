<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ποιος θέλει να γίνει... Φυσικός! - InclusiLab</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .game-container {
            width: 100%;
            max-width: 700px;
            background: rgba(15, 32, 39, 0.95);
            border: 3px solid #f1c40f;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            text-align: center;
        }
        h1 {
            color: #f1c40f;
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .subtitle {
            color: #a0aec0;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .coins { color: #f1c40f; }
        .question-box {
            background: #1a365d;
            border: 2px solid #3182ce;
            border-radius: 10px;
            padding: 20px;
            font-size: 1.2rem;
            margin-bottom: 25px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
        }
        .option-btn {
            background: linear-gradient(135deg, #2b6cb0, #2c5282);
            color: white;
            border: 2px solid #4299e1;
            padding: 15px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            font-weight: 500;
        }
        .option-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #3182ce, #2b6cb0);
            border-color: #f1c40f;
            transform: translateY(-2px);
        }
        .option-btn.correct { background: #2f855a !important; border-color: #48bb78 !important; }
        .option-btn.wrong   { background: #9b2c2c !important; border-color: #f56565 !important; }
        .message-box {
            margin-top: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 30px;
        }
        .btn-restart {
            background: #f1c40f;
            color: #0f2027;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            display: none;
        }
        .btn-restart:hover { background: #d4ac0d; }
        .back-link {
            display: inline-block;
            margin-top: 18px;
            color: #a0aec0;
            font-size: 0.9rem;
            text-decoration: none;
        }
        .back-link:hover { color: #f1c40f; }
    </style>
</head>
<body>
<div class="game-container">
    <h1>🏆 Ποιος θέλει να γίνει... Φυσικός!</h1>
    <p class="subtitle">Όμιλος Φυσικής & Χημείας Γυμνασίου Γουριάς • Φυσική Β' & Γ' Γυμνασίου</p>

    <div class="stats-bar">
        <span id="question-counter">Ερώτηση 1 / 6</span>
        <span class="coins">🪙 <span id="score">0</span> Coins</span>
    </div>

    <div class="question-box" id="question-text">Φόρτωση ερώτησης...</div>

    <div class="options-grid" id="options-container"></div>

    <div class="message-box" id="message"></div>
    <button class="btn-restart" id="restart-btn" onclick="startGame()">Νέο Παιχνίδι</button>
    <br>
    <a class="back-link" href="/games/">← Επιστροφή στην κεντρική σελίδα</a>
</div>

<script>
const quizData = [
    {
        question: "Ποιο φυσικό μέγεθος εκφράζει τη μετατόπιση ανά μονάδα χρόνου σε μια ευθύγραμμη κίνηση;",
        options: ["Α. Δύναμη", "Β. Ταχύτητα", "Γ. Επιτάχυνση", "Δ. Έργο"],
        correct: 1,
        reward: 100
    },
    {
        question: "Ποια χημική ένωση δίνει σε υδατικό διάλυμα pH μικρότερο από 7 και ξινή γεύση;",
        options: ["Α. Οξύ", "Β. Βάση", "Γ. Άλας", "Δ. Νερό"],
        correct: 0,
        reward: 250
    },
    {
        question: "Ποιος είναι ο πυρήνας ενός ατόμου του υδρογόνου (το πιο απλό άτομο);",
        options: ["Α. Ένα νετρόνιο", "Β. Ένα πρωτόνιο", "Γ. Ένα ηλεκτρόνιο", "Δ. Δύο πρωτόνια"],
        correct: 1,
        reward: 500
    },
    {
        question: "Σύμφωνα με τον νόμο του Ohm, ποια σχέση συνδέει την τάση (V), την ένταση (I) και την αντίσταση (R);",
        options: ["Α. V = I / R", "Β. R = V * I", "Γ. V = I * R", "Δ. I = V * R"],
        correct: 2,
        reward: 1000
    },
    {
        question: "Ποιο σωματίδιο στο άτομο φέρει αρνητικό ηλεκτρικό φορτίο;",
        options: ["Α. Πρωτόνιο", "Β. Νετρόνιο", "Γ. Ηλεκτρόνιο", "Δ. Πυρήνας"],
        correct: 2,
        reward: 2500
    },
    {
        question: "Ποια μονάδα μέτρησης στο Διεθνές Σύστημα (SI) αντιστοιχεί στη δύναμη;",
        options: ["Α. Joule (J)", "Β. Newton (N)", "Γ. Watt (W)", "Δ. Pascal (Pa)"],
        correct: 1,
        reward: 5000
    }
];

let currentQuestionIndex = 0;
let totalCoins = 0;
let answerLocked = false;

function startGame() {
    currentQuestionIndex = 0;
    totalCoins = 0;
    document.getElementById('restart-btn').style.display = 'none';
    loadQuestion();
}

function loadQuestion() {
    answerLocked = false;
    document.getElementById('message').innerText = '';
    const currentQ = quizData[currentQuestionIndex];
    document.getElementById('question-counter').innerText = `Ερώτηση ${currentQuestionIndex + 1} / ${quizData.length}`;
    document.getElementById('score').innerText = totalCoins;
    document.getElementById('question-text').innerText = currentQ.question;

    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';
    currentQ.options.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.classList.add('option-btn');
        btn.innerText = option;
        btn.onclick = () => selectAnswer(index, btn);
        optionsContainer.appendChild(btn);
    });
}

function selectAnswer(selectedIndex, selectedBtn) {
    if (answerLocked) return;
    answerLocked = true;
    const currentQ = quizData[currentQuestionIndex];
    const buttons = document.querySelectorAll('.option-btn');

    if (selectedIndex === currentQ.correct) {
        selectedBtn.classList.add('correct');
        totalCoins += currentQ.reward;
        document.getElementById('score').innerText = totalCoins;
        document.getElementById('message').style.color = '#48bb78';
        document.getElementById('message').innerText = `🎉 Μπράβο! Κέρδισες +${currentQ.reward} Χρυσά Coins!`;
        currentQuestionIndex++;
        setTimeout(() => {
            if (currentQuestionIndex < quizData.length) loadQuestion();
            else endGame(true);
        }, 1500);
    } else {
        selectedBtn.classList.add('wrong');
        buttons[currentQ.correct].classList.add('correct');
        document.getElementById('message').style.color = '#f56565';
        document.getElementById('message').innerText = '❌ Λάθος απάντηση!';
        setTimeout(() => endGame(false), 2000);
    }
}

function endGame(won) {
    document.getElementById('options-container').innerHTML = '';
    const msg = document.getElementById('message');
    if (won) {
        msg.style.color = '#f1c40f';
        msg.innerHTML = `🌟 Συγχαρητήρια! Έγινες Κορυφαίος Φυσικός του Ομίλου με <b>${totalCoins} Χρυσά Coins</b>!`;
    } else {
        msg.style.color = '#e2e8f0';
        msg.innerHTML = `Τέλος παιχνιδιού! Μάζεψες <b>${totalCoins} Χρυσά Coins</b>. Ξαναδοκίμασε για το 6/6!`;
    }
    document.getElementById('restart-btn').style.display = 'inline-block';
}

startGame();
</script>
</body>
</html>
